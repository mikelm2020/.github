name: GGA — AI Code Review (reusable)

# Desactivado org-wide (2026-09-15): GGA choca con el flujo de RDD
# (gentle-ai review) — casos concretos donde ambos revisores exigen
# comportamientos opuestos sobre el mismo diff (ej. "except Exception"
# amplio deliberado vs. "nunca except Exception genérico"). El proyecto
# gentle-ai ya no planea mantener la integración con GGA. Se deja este
# job como no-op en vez de borrar el archivo para no romper los
# workflows llamadores (`.github/workflows/ai-review.yml`) en los repos
# satélite, que siguen invocándolo por nombre.

on:
  workflow_call:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: GGA desactivado
        run: echo "GGA está desactivado org-wide — ver comentario en este workflow."
